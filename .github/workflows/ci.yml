name: CI/CD

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 生成标签
        id: tags
        run: |
          ALIYUN_IMAGE="registry.cn-hangzhou.aliyuncs.com/wylhub/gin-vue3-blog"
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            echo "tags=${ALIYUN_IMAGE}:${VERSION}" >> $GITHUB_OUTPUT
            echo "📦 检测到预发布版本: v${VERSION} (不打 latest 标签)"
          else
            echo "tags=${ALIYUN_IMAGE}:${VERSION},${ALIYUN_IMAGE}:latest" >> $GITHUB_OUTPUT
            echo "🚀 正式版本: v${VERSION} (打 latest 标签)"
          fi

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          provenance: false
          build-args: |
            GOPROXY=https://proxy.golang.org,direct

      - name: 推送镜像到阿里云
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          IMAGE="registry.cn-hangzhou.aliyuncs.com/wylhub/gin-vue3-blog"
          docker push ${IMAGE}:${VERSION}
          if [[ ! "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            docker push ${IMAGE}:latest
          fi

      - name: 导出镜像文件（作为 Release 附件）
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          IMAGE="registry.cn-hangzhou.aliyuncs.com/wylhub/gin-vue3-blog"
          IMAGES="${IMAGE}:${VERSION}"
          if [[ ! "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            IMAGES="${IMAGES} ${IMAGE}:latest"
          fi
          docker save ${IMAGES} | gzip > gin-vue3-blog_${VERSION}_docker_amd64.tar.gz
          ls -lh gin-vue3-blog_${VERSION}_docker_amd64.tar.gz

      - name: 生成 Changelog
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -10)
          fi

          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          cat > release_notes.md << EOF
          ## 🎉 Gin-Vue3-Blog v${VERSION} 发布

          ### 📋 构建信息
          - **版本**: v${VERSION}
          - **Commit**: ${GITHUB_SHA:0:7}
          - **构建时间**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ### 📝 更新内容
          ${COMMITS}

          ### 🐳 Docker 镜像
          \`\`\`bash
          docker pull registry.cn-hangzhou.aliyuncs.com/wylhub/gin-vue3-blog:${VERSION}
          \`\`\`

          ### 📦 镜像文件（离线加载）
          - \`gin-vue3-blog_${VERSION}_docker_amd64.tar.gz\`
          \`\`\`bash
          docker load -i gin-vue3-blog_${VERSION}_docker_amd64.tar.gz
          \`\`\`
          EOF

          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.changelog.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          files: |
            gin-vue3-blog_*_docker_amd64.tar.gz
